# docker-compose.yml
#
# SERVER OPERATOR sets GHOST_API_URL here — this locks the container to your
# specific Ghost instance. MCP clients (e.g. Claude Desktop) cannot override it.
#
# MCP CLIENTS provide at connection time (not here):
#   - GHOST_ADMIN_API_KEY   (required)
#   - GHOST_API_VERSION     (optional, defaults to v5.0)
#
# Usage example for an MCP client (e.g. Claude Desktop):
#   {
#     "mcpServers": {
#       "ghost": {
#         "command": "docker",
#         "args": ["run", "-i", "--rm",
#                  "-e", "GHOST_ADMIN_API_KEY",
#                  "-e", "GHOST_API_VERSION",
#                  "ghcr.io/laul0/ghost-mcp:latest"],
#         "env": {
#           "GHOST_ADMIN_API_KEY": "your-id:your-secret",
#           "GHOST_API_VERSION": "v5.0"
#         }
#       }
#     }
#   }

services:
  ghost-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghost-mcp:latest
    environment:
      # ── Server-side only (locked by the operator) ──────────────────────────
      # Restricts this container to your Ghost instance.
      # GHOST_ADMIN_API_KEY and GHOST_API_VERSION are NOT defined here —
      # they must be supplied by the MCP client at connection time.
      GHOST_API_URL: ${GHOST_API_URL}
    # Keep stdin open so the MCP stdio transport works correctly
    stdin_open: true
    tty: false
    restart: unless-stopped
